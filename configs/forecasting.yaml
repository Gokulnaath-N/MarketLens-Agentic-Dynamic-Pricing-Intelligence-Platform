# MarketLens AI — Demand Forecasting and Time-Series Modeling Configuration

data:
  # Target grain and key definitions established in Phase 2
  entity_grain: "product_week" # Options: product_week, product_day
  target_column: "units_sold"
  time_column: "period_start"
  product_id_column: "product_id"
  price_column: "mean_unit_price"

splits:
  # Temporal validation splits (chronological order strictly preserved)
  method: "chronological_holdout"
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15

leakage_prevention:
  enforce_strict_chronological_features: true
  min_history_periods: 8
  allow_forward_filling_signals: false
  shift_horizon: 1

models:
  random_seed: 42
  horizon_periods: 1 # Weekly horizon

  naive_baseline:
    enabled: true
    strategy: "last_observed"

  moving_average:
    enabled: true
    window: 4

  ridge_regression:
    enabled: true
    alpha: 1.0

  random_forest:
    enabled: true
    n_estimators: 100
    max_depth: 10

evaluation:
  metrics:
    - "mae"
    - "rmse"
    - "wape"
    - "mase"
    - "r2"
