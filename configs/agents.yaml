# MarketLens AI — Market Intelligence and Review Analysis Agents Configuration

general:
  # In Phase 4, agent workflows run deterministically offline (mock / rule-based)
  agents_enabled: true
  default_provider: "mock" # Options: mock, rule_based, gemini, openai
  request_timeout_seconds: 30
  max_retries: 2
  log_prompts_and_responses: false # Kept false to strictly protect customer PII

review_insight_agent:
  enabled: true
  default_extraction_method: "rule_based" # Options: rule_based, mock, llm
  model_name: "gemini-1.5-flash"
  batch_size: 32
  max_text_chars: 4000
  validate_schema: true
  min_evidence_length_chars: 10
  sentiment_scale:
    min_score: -1.0
    max_score: 1.0
  aspect_categories:
    - "product_quality"
    - "value_for_money"
    - "delivery_shipping"
    - "customer_service"
    - "packaging"

competitor_monitoring_agent:
  enabled: true
  price_change_alert_threshold_pct: 5.0 # Alert when competitor changes price by >= 5%
  max_observation_age_days: 7
  allow_currency_conversion: false

market_signal_aggregator:
  enabled: true
  review_lookback_days: 30
  competitor_lookback_days: 7
  minimum_reviews_for_aggregate: 5
  time_alignment_window_days: 7
  require_provenance: true

