[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketlens-ai"
version = "0.1.0"
description = "A Hybrid Machine Learning and Generative AI Framework for Real-Time Demand Forecasting, Competitor Intelligence, Customer Sentiment Analysis, and Revenue Optimization."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Gokulnaath N", email = "gokulnaath@example.com" }
]
keywords = [
    "dynamic-pricing",
    "demand-forecasting",
    "market-intelligence",
    "decision-support",
    "machine-learning",
    "agentic-ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core runtime dependencies for Phase 0 foundation & data handling
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]
data = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
]
forecasting = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0; python_version < '3.14'",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
dashboard = [
    "streamlit>=1.30.0",
]
mlops = [
    "mlflow>=2.10.0",
]
all = [
    "marketlens-ai[dev,data,forecasting,api,dashboard,mlops]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
